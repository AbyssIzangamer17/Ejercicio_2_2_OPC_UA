<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <title>SCADA HMI - OPC-UA Monitor</title>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;600&family=JetBrains+Mono&display=swap"
        rel="stylesheet">
    <style>
        body {
            background: #121212;
            color: #00ff00;
            font-family: 'JetBrains Mono', monospace;
            padding: 40px;
            margin: 0;
        }

        .hmi-grid {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 30px;
        }

        .gauge {
            border: 2px solid #333;
            padding: 30px;
            text-align: center;
            background: #1a1a1a;
            border-radius: 10px;
            position: relative;
        }

        .gauge h3 {
            color: #888;
            margin-top: 0;
            font-family: 'Outfit', sans-serif;
        }

        .value {
            font-size: 3.5rem;
            font-weight: 600;
            margin: 20px 0;
        }

        .status {
            position: absolute;
            top: 10px;
            right: 10px;
            font-size: 0.7rem;
            padding: 3px 10px;
            border-radius: 5px;
        }

        .ok {
            background: rgba(0, 255, 0, 0.2);
            color: #00ff00;
        }

        .warn {
            background: rgba(255, 0, 0, 0.2);
            color: #ff0000;
            animation: blink 1s infinite;
        }

        @keyframes blink {
            50% {
                opacity: 0;
            }
        }

        .logs {
            border-top: 1px solid #333;
            margin-top: 40px;
            height: 150px;
            overflow-y: auto;
            padding-top: 10px;
            color: #555;
            font-size: 0.8rem;
        }
    </style>
</head>

<body>
    <h2 style="color: white; font-family: 'Outfit';">📡 Industrial OPC-UA <span
            style="font-weight: 300; font-size: 0.7em;">v4.0 HMI Interface</span></h2>
    <div class="hmi-grid">
        <div class="gauge">
            <div id="s1" class="status ok">LINK ACTIVE</div>
            <h3>SENSOR TEMPERATURA</h3>
            <div class="value" id="temp">20.4°C</div>
            <p>NodeId: ns=2;i=10</p>
        </div>
        <div class="gauge">
            <div id="s2" class="status ok">LINK ACTIVE</div>
            <h3>SENSOR PRESIÓN</h3>
            <div class="value" id="pres">1.02 bar</div>
            <p>NodeId: ns=2;i=11</p>
        </div>
    </div>
    <div class="logs" id="logs">
        [SYSTEM] Starting OPC-UA Client Session...<br>
        [SYSTEM] Namespace: http://izan.urios.industrial<br>
    </div>
    <script>
        function update() {
            const t = (20 + (Math.random() * 4 - 2)).toFixed(2);
            const p = (1 + (Math.random() * 0.2 - 0.1)).toFixed(2);
            document.getElementById('temp').innerText = t + '°C';
            document.getElementById('pres').innerText = p + ' bar';
            const log = document.getElementById('logs');
            const s1 = document.getElementById('s1');
            if (t > 21) {
                log.innerHTML += `[${new Date().toLocaleTimeString()}] ALERT: Temp High at ${t}°C<br>`;
                s1.className = "status warn"; s1.innerText = "WARNING";
            } else {
                s1.className = "status ok"; s1.innerText = "LINK ACTIVE";
            }
            log.scrollTop = log.scrollHeight;
        }
        setInterval(update, 2000);
    </script>
</body>

</html>
