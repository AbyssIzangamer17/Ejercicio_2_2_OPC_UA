<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <title>SCADA Industrial HMI v5.0 - Ecosistema Izan Urios</title>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;600&family=JetBrains+Mono&display=swap"
        rel="stylesheet">
    <style>
        :root {
            --bg: #0a0a0f;
            --panel: #161625;
            --accent: #00f2ff;
            --warn: #ff3e3e;
            --safe: #10b981;
        }

        body {
            background: var(--bg);
            color: white;
            font-family: 'Outfit', sans-serif;
            margin: 0;
            padding: 30px;
            overflow: hidden;
        }

        .dashboard {
            display: grid;
            grid-template-columns: 2fr 1fr;
            gap: 20px;
            max-width: 1300px;
            margin: 0 auto;
            height: 90vh;
        }

        .main-panel {
            background: var(--panel);
            border-radius: 24px;
            padding: 40px;
            border: 1px solid rgba(0, 242, 255, 0.1);
            display: flex;
            flex-direction: column;
        }

        .gauge-container {
            display: flex;
            justify-content: space-around;
            margin-top: 40px;
        }

        .value {
            font-size: 4rem;
            font-weight: 600;
            color: var(--accent);
        }

        .log-v {
            background: #000;
            flex: 1;
            border-radius: 12px;
            padding: 15px;
            font-family: 'JetBrains Mono', monospace;
            font-size: 0.8rem;
            color: #4ade80;
            overflow-y: auto;
            border: 1px solid #333;
            margin-top: 20px;
        }

        .status-light {
            width: 12px;
            height: 12px;
            border-radius: 50%;
            display: inline-block;
            background: var(--safe);
            box-shadow: 0 0 10px var(--safe);
        }

        .alert-mode {
            background: var(--warn);
            box-shadow: 0 0 15px var(--warn);
            animation: pulse 1s infinite;
        }

        @keyframes pulse {
            50% {
                opacity: 0.5;
            }
        }

        .btn-ack {
            margin-top: 20px;
            padding: 15px;
            background: #333;
            border: 1px solid #444;
            color: white;
            border-radius: 10px;
            cursor: pointer;
            font-weight: 600;
            text-transform: uppercase;
        }

        .btn-ack:hover {
            background: #444;
        }

        .chart-sim {
            height: 100px;
            width: 100%;
            border-bottom: 2px solid #333;
            position: relative;
            overflow: hidden;
            margin-top: 40px;
        }

        .bar {
            position: absolute;
            bottom: 0;
            background: var(--accent);
            opacity: 0.3;
            width: 10px;
            transition: 0.2s;
        }
    </style>
</head>

<body>
    <div class="dashboard">
        <div class="main-panel">
            <div style="display: flex; justify-content: space-between; align-items: center;">
                <h1>OPC-UA Real-Time SCADA <span style="font-weight: 300; font-size: 0.5em; opacity: 0.5;">IZAN
                        V5.0</span></h1>
                <div id="alarm-box"
                    style="display: none; padding: 5px 15px; background: var(--warn); border-radius: 5px; font-weight: bold; font-size: 0.8rem; animation: blink 0.5s infinite;">
                    ⚠️ ALARMA CRÍTICA</div>
            </div>

            <div class="gauge-container">
                <div style="text-align: center;">
                    <div class="value" id="t-val">22.4°C</div>
                    <div style="color: #666; font-size: 0.8rem;">TEMP REACTOR (ns=2;i=10)</div>
                </div>
                <div style="text-align: center;">
                    <div class="value" id="p-val" style="color: #a855f7;">1.02</div>
                    <div style="color: #666; font-size: 0.8rem;">PRESIÓN CIRCUITO (ns=2;i=11)</div>
                </div>
            </div>

            <div class="chart-sim" id="chart"></div>

            <button class="btn-ack" onclick="acknowledge()">Aceptar Alarma y Resetear Historial</button>
        </div>

        <div
            style="background: var(--panel); border-radius: 20px; padding: 25px; border: 1px solid rgba(255,255,255,0.05); display: flex; flex-direction: column;">
            <h2 style="font-size: 1rem; margin-top: 0;">TERMINAL DE SUSCRIPCIONES</h2>
            <div class="log-v" id="logs"></div>
        </div>
    </div>

    <script>
        let alarmActive = false;
        function update() {
            if (alarmActive) return;
            const t = (20 + (Math.random() * 8)).toFixed(2);
            const p = (0.8 + (Math.random() * 0.6)).toFixed(2);
            document.getElementById('t-val').innerText = t + '°C';
            document.getElementById('p-val').innerText = p;

            const logs = document.getElementById('logs');
            const alertBox = document.getElementById('alarm-box');

            // Simulación gráfico
            const chart = document.getElementById('chart');
            const b = document.createElement('div');
            b.className = 'bar';
            b.style.height = (t * 3) + 'px';
            b.style.left = '1000px';
            chart.appendChild(b);
            Array.from(chart.children).forEach(child => {
                const currentLeft = parseInt(child.style.left);
                child.style.left = (currentLeft - 15) + 'px';
                if (currentLeft < 0) child.remove();
            });

            if (t > 27) {
                alarmActive = true;
                alertBox.style.display = 'block';
                logs.innerHTML += `<div style="color: var(--warn);">[${new Date().toLocaleTimeString()}] !!! CRITICAL TEMP EXCEEDED: ${t}°C !!!</div>`;
            } else {
                logs.innerHTML += `<div>[${new Date().toLocaleTimeString()}] Sub: ns=2;i=10 -> ${t}°C</div>`;
            }
            logs.scrollTop = logs.scrollHeight;
        }

        function acknowledge() {
            alarmActive = false;
            document.getElementById('alarm-box').style.display = 'none';
            document.getElementById('logs').innerHTML = `<div style="color: var(--safe); font-weight: bold;">[${new Date().toLocaleTimeString()}] SYSTEM RESET: Alarm Acknowledged by User.</div>`;
        }
        setInterval(update, 1000);
    </script>
</body>

</html>
